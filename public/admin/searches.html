<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vukafia Search Log</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --bg:        #f4f4f1;
    --surface:   #fcfcfb;
    --border:    #e3e2dc;
    --text:      #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #6b6a64;
    --series-1:  #2a78d6;
    --track:     #e6eefb;
    --chip:      #efeee9;
    --focus:     #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --border: #2e2e2b;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #9b9a91;
      --series-1: #3987e5; --track: #1f2a3b; --chip: #262624; --focus: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2b;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #9b9a91;
    --series-1: #3987e5; --track: #1f2a3b; --chip: #262624; --focus: #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
  .sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  input, select, button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-height: 36px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--text-3); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 12px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin: 12px 0; }

  .tile .label { color: var(--text-2); font-size: 13px; }
  .tile .value { font-size: 30px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
  .tile .note  { color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .breakdown { color: var(--text-3); font-size: 13px; margin: 0 0 4px; }

  /* login */
  #login { max-width: 360px; margin: 12vh auto 0; }
  #login form { display: grid; gap: 10px; margin-top: 12px; }
  #login .err { color: var(--text); font-size: 13px; }
  #login .err::before { content: "⚠ "; }

  /* ranked bars */
  ol.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .bars .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .bars .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .n { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .bars .track { height: 6px; background: var(--track); border-radius: 0 4px 4px 0; margin-top: 4px; }
  .bars .fill  { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 4px; }
  .empty { color: var(--text-3); font-size: 14px; padding: 8px 0; }

  /* log */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters input[type=search] { flex: 1 1 200px; }
  .filters label { display: flex; gap: 6px; align-items: center; color: var(--text-2); font-size: 14px; }
  .filters input[type=checkbox] { min-height: 0; width: 16px; height: 16px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
  td.time { color: var(--text-3); white-space: nowrap; font-size: 13px; }
  td.query { min-width: 200px; max-width: 360px; overflow-wrap: anywhere; }
  .chip { display: inline-block; background: var(--chip); color: var(--text-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; margin: 0 4px 3px 0; }
  .chip b { font-weight: 600; color: var(--text-3); }
  .zero { font-weight: 650; }
  @media (max-width: 640px) {
    /* rows become stacked cards: query, what it was understood as, then a meta line */
    thead { display: none; }
    table, tbody { display: block; }
    tr { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    td { display: block; padding: 0; border: 0; }
    td.query  { order: 1; flex: 1 1 100%; min-width: 0; max-width: none; font-weight: 600; }
    td.parsed { order: 2; flex: 1 1 100%; }
    td.time, td.src, td.parser, td.num { order: 3; color: var(--text-3); font-size: 13px; font-weight: 400; text-align: left; }
    td.num::after { content: " results"; }
    td.num.zero { color: var(--text); font-weight: 650; }
  }
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; color: var(--text-3); font-size: 13px; }
</style>
</head>
<body>
<main>

  <section id="login" class="card" hidden>
    <h1>Search log</h1>
    <div class="sub">Sign in with an admin account</div>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <div id="login-err" class="err" role="alert" hidden></div>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <header>
      <div>
        <h1>Search log</h1>
        <div class="sub">What people ask for, and what the directory can't answer yet</div>
      </div>
      <div class="controls">
        <select id="days" aria-label="Time range">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="365">Last year</option>
        </select>
        <button id="refresh" type="button">Refresh</button>
        <button id="logout" type="button">Sign out</button>
      </div>
    </header>

    <div id="tiles" class="grid tiles"></div>
    <p id="breakdown" class="breakdown"></p>

    <div class="grid two">
      <section class="card">
        <h2>Top searches</h2>
        <ol id="top" class="bars"></ol>
      </section>
      <section class="card">
        <h2>Not found <span class="sub">— searches with zero results</span></h2>
        <ol id="notfound" class="bars"></ol>
      </section>
    </div>

    <section class="card">
      <h2>All searches</h2>
      <div class="filters">
        <input id="f-q" type="search" placeholder="Search the log…" aria-label="Search the log">
        <select id="f-source" aria-label="Source">
          <option value="">All sources</option>
          <option value="web">Web</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
        <select id="f-ai" aria-label="Parser">
          <option value="">AI + keyword</option>
          <option value="true">AI only</option>
          <option value="false">Keyword fallback only</option>
        </select>
        <label><input id="f-zero" type="checkbox"> Zero results only</label>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>When</th><th>Query</th><th>Understood as</th><th>Source</th><th>Parser</th><th class="num">Results</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="log-empty" class="empty" hidden>No searches match.</div>
      <div class="pager">
        <span id="page-info"></span>
        <button id="prev" type="button">Previous</button>
        <button id="next" type="button">Next</button>
      </div>
    </section>
  </div>

</main>
<script src="/admin/searches.js"></script>
</body>
</html>
