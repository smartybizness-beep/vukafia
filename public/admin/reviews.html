<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vukafia Review Approvals</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f1; --surface: #fcfcfb; --border: #e3e2dc;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #6b6a64;
    --accent: #2a78d6; --good: #1e7a3c; --bad: #b3261e; --flag: #fdf1e6; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --border: #2e2e2b;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #9b9a91;
      --accent: #3987e5; --good: #4fb06d; --bad: #f2827a; --flag: #33261a; --chip: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2b;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #9b9a91;
    --accent: #3987e5; --good: #4fb06d; --bad: #f2827a; --flag: #33261a; --chip: #262624;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  .sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  a { color: var(--accent); }
  input, button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; min-height: 40px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--text-3); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.approve { background: var(--good); border-color: var(--good); color: #fff; font-weight: 600; }
  button.reject { color: var(--bad); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  #login { max-width: 360px; margin: 12vh auto 0; }
  #login form { display: grid; gap: 10px; margin-top: 12px; }
  .err { font-size: 13px; }
  .err::before { content: "⚠ "; }
  #list { display: grid; gap: 12px; }
  .review .top { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  .review .biz { font-weight: 650; }
  .review .meta { color: var(--text-3); font-size: 13px; }
  .review .stars { white-space: nowrap; }
  .review blockquote { margin: 12px 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .review .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .review .actions button { flex: 1 1 140px; }
  .flag { display: inline-block; background: var(--flag); border-radius: 6px; padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  .empty { color: var(--text-3); text-align: center; padding: 32px 0; }
  .status { color: var(--text-2); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<main>
  <section id="login" class="card" hidden>
    <h1>Review approvals</h1>
    <div class="sub">Sign in with an admin account</div>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <div id="login-err" class="err" role="alert" hidden></div>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <section id="app" hidden>
    <header>
      <div>
        <h1>Review approvals</h1>
        <div class="sub">Reviews only appear on business pages after you approve them</div>
      </div>
      <div class="controls">
        <a href="/admin/searches">Search log</a>
        <button id="refresh" type="button">Refresh</button>
        <button id="logout" type="button">Sign out</button>
      </div>
    </header>
    <div id="status" class="status" role="status"></div>
    <div id="list"></div>
  </section>
</main>
<script src="/admin/reviews.js"></script>
</body>
</html>
